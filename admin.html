<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Panel Admina — CliPro</title>
  <style>
    body { font-family: Arial; background:#02030a; color:#fff; padding:20px }
    h2 { margin-bottom:20px }
    .comment {
      background:#0b0d1c;
      border:1px solid rgba(255,215,0,.35);
      padding:14px;
      margin-bottom:12px;
      border-radius:12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.6);
    }
    button {
      margin-right:8px;
      padding:6px 12px;
      border-radius:6px;
      border:none;
      cursor:pointer;
      font-weight:700;
    }
    .ok { background:#22c55e; color:#000 }
    .del { background:#ef4444; color:#000 }
  </style>
</head>
<body>

<script>
const PASSWORD = "clipro123"; // ← zmień na swoje hasło

const input = prompt("🔐 Podaj hasło do panelu admina:");
if (input !== PASSWORD) {
  document.body.innerHTML = "<h2 style='color:white'>❌ Brak dostępu</h2>";
  throw new Error("Unauthorized");
}
</script>


<h2>📋 Panel admina — komentarze do zatwierdzenia</h2>
<div id="comments"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  query,
  where,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpj6rJBUOC2ewZE2-h3zgJFKP2NFezCYY",
  authDomain: "komentarze-clipro.firebaseapp.com",
  projectId: "komentarze-clipro",
  storageBucket: "komentarze-clipro.firebasestorage.app",
  messagingSenderId: "1095372708623",
  appId: "1:1095372708623:web:16256fc2cb756fa7cffc7a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("comments");

async function load() {
  container.innerHTML = "";
  const q = query(
  collection(db, "uwagi"),
  where("status", "==", "pending")
);
  const snap = await getDocs(q);
console.log("ILOŚĆ:", snap.size);
  snap.forEach(docu => {
    const data = docu.data();
    const div = document.createElement("div");
    div.className = "comment";
    div.innerHTML = `
      <strong>${data.name}</strong><br>
      ${"★".repeat(data.rating)}${"☆".repeat(5 - data.rating)}<br>
      <p>${data.text}</p>
      <button class="ok" onclick="approve('${docu.id}')">✅ Akceptuj</button>
      <button class="del" onclick="remove('${docu.id}')">❌ Usuń</button>
    `;
    container.appendChild(div);
  });
}

window.approve = async (id) => {
  await updateDoc(doc(db, "uwagi", id), { status: "approved" });
  load();
};

window.remove = async (id) => {
  await deleteDoc(doc(db, "uwagi", id));
  load();
};

load();
</script>

</body>
</html>
